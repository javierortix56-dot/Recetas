<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ccf8e"/><stop offset="0.6" stop-color="#25945f"/><stop offset="1" stop-color="#1b6b45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc35a"/><stop offset="1" stop-color="#e88a1a"/>
    </linearGradient>
    <linearGradient id="bunB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a838"/><stop offset="1" stop-color="#d9780f"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4424"/><stop offset="1" stop-color="#4e2812"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b3d26" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- pan de abajo -->
    <rect x="106" y="338" width="300" height="56" rx="26" fill="url(#bunB)"/>
    <!-- carne -->
    <rect x="96" y="286" width="320" height="58" rx="29" fill="url(#patty)"/>
    <!-- queso derretido -->
    <path d="M100 272 H412 L404 290 L372 290 L356 318 L340 290 L250 290 L232 322 L214 290 L150 290 L136 312 L122 290 L108 290 Z" fill="#ffd43b"/>
    <!-- tomate -->
    <rect x="104" y="252" width="304" height="26" rx="13" fill="#ef4444"/>
    <!-- lechuga -->
    <path d="M92 230 H420 V252 q-16 18 -32 0 q-16 -10 -32 0 q-16 18 -32 0 q-16 -10 -32 0 q-16 18 -32 0 q-16 -10 -32 0 q-16 18 -32 0 q-16 -10 -32 0 q-16 18 -32 0 q-16 -10 -32 0 V230 Z" fill="#a3e635"/>
    <!-- pan de arriba -->
    <path d="M96 238 C96 150 166 106 256 106 C346 106 416 150 416 238 Z" fill="url(#bun)"/>
    <path d="M128 200 C140 156 186 128 236 124" stroke="#fff" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- sésamo -->
    <g fill="#fff6dc">
      <ellipse cx="196" cy="160" rx="9" ry="5" transform="rotate(-25 196 160)"/>
      <ellipse cx="256" cy="140" rx="9" ry="5" transform="rotate(10 256 140)"/>
      <ellipse cx="316" cy="162" rx="9" ry="5" transform="rotate(30 316 162)"/>
      <ellipse cx="226" cy="196" rx="9" ry="5" transform="rotate(-10 226 196)"/>
      <ellipse cx="292" cy="198" rx="9" ry="5" transform="rotate(20 292 198)"/>
      <ellipse cx="166" cy="208" rx="9" ry="5" transform="rotate(-35 166 208)"/>
      <ellipse cx="350" cy="208" rx="9" ry="5" transform="rotate(35 350 208)"/>
    </g>
  </g>
</svg>
